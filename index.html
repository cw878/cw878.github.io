<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix CleanTech Group — Green Finance & Energy Transition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1C3327; --forest-deep:#0F1E15; --moss:#4A6B4A; --sage:#8FAF8A;
  --clay:#A8521E; --gold:#B8882A; --gold-light:#D4A84B;
  --cream:#F7F3EB; --cream-dark:#EDE6D4;
  --ink:#1A1710; --ink-mid:#3D3A30; --ink-light:#6B6758;
  --rule:rgba(26,23,16,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:'Public Sans',sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Lora',serif;font-weight:500;line-height:1.12;letter-spacing:-0.02em;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;font-family:inherit;border:none;}
img,svg{display:block;}

.nav{position:sticky;top:0;z-index:200;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1.25rem,4vw,3.5rem);background:rgba(247,243,235,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);gap:1rem;}
.brand{display:flex;align-items:center;gap:0.6rem;cursor:pointer;flex-shrink:0;}
.brand svg{width:22px;height:28px;flex-shrink:0;}
.brand-name{font-family:'Lora',serif;font-size:0.98rem;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;}
.brand-name .c1{color:var(--clay);}
.nav-links{display:flex;gap:1.8rem;}
.nav-links button{background:none;font-size:0.84rem;color:var(--ink-mid);padding:0.2rem 0;position:relative;letter-spacing:0.01em;transition:color .18s;white-space:nowrap;}
.nav-links button:hover,.nav-links button.active{color:var(--ink);}
.nav-links button.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1.5px;background:var(--clay);}
.nav-ctas{display:flex;gap:0.6rem;flex-shrink:0;}
.nav-cta-primary{background:var(--clay);color:var(--cream);padding:0.5rem 1rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.04em;white-space:nowrap;transition:opacity .18s;}
.nav-cta-primary:hover{opacity:.85;}
.nav-cta-secondary{background:transparent;color:var(--forest);border:1px solid var(--rule);padding:0.5rem 1rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.04em;white-space:nowrap;transition:border-color .18s;}
.nav-cta-secondary:hover{border-color:var(--clay);}

.page{display:none;}
.page.active{display:block;animation:appear .3s ease both;}
@keyframes appear{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(1.5rem,5vw,4.5rem);}

/* HERO */
.h-hero{background:var(--forest);color:var(--cream);padding:clamp(3.5rem,6vw,5.5rem) 0 0 0;position:relative;overflow:hidden;}
.h-hero-body{max-width:1160px;margin:0 auto;padding:0 clamp(1.5rem,5vw,4rem);padding-bottom:clamp(2.5rem,5vw,3.5rem);display:flex;flex-direction:column;gap:1.5rem;}
.h-hero-kicker{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--sage);display:flex;align-items:center;gap:0.75rem;}
.h-hero-kicker::before{content:'';width:24px;height:1px;background:var(--gold);}
.h-hero-left{display:flex;flex-direction:column;gap:1rem;max-width:820px;}
.h-hero-h1{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:500;color:var(--cream);line-height:1.12;}
.h-hero-right{display:flex;flex-direction:column;gap:1.5rem;align-items:flex-start;width:100%;max-width:720px;}
.h-hero-desc{font-size:1.12rem;color:rgba(247,243,235,0.85);line-height:1.55;}
.h-hero-btns{display:flex;gap:0.75rem;flex-wrap:wrap;}
.btn-primary{background:var(--clay);color:var(--cream);padding:0.85rem 1.5rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.04em;transition:opacity .18s;}
.btn-primary:hover{opacity:.88;}
.btn-secondary{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,0.25);padding:0.85rem 1.5rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.04em;transition:border-color .18s;}
.btn-secondary:hover{border-color:rgba(255,255,255,0.55);}

.h-stats{display:grid;grid-template-columns:repeat(4,1fr);max-width:1160px;margin:0 auto;border-top:1px solid rgba(255,255,255,0.15);border-bottom:1px solid rgba(255,255,255,0.15);}
.h-stat{padding:1.4rem 1.6rem;border-right:1px solid rgba(255,255,255,0.08);}
.h-stat:last-child{border-right:none;}
.h-stat-val{font-family:'Lora',serif;font-size:1.15rem;color:var(--gold-light);margin-bottom:0.2rem;}
.h-stat-lab{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(143,175,138,0.75);}

.section-header{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2rem;margin-bottom:2.5rem;padding-bottom:1.3rem;border-bottom:1px solid var(--rule);}
.section-header h2{font-size:clamp(1.2rem,1.8vw,1.55rem);white-space:nowrap;}
.section-header-rule{height:1px;background:linear-gradient(90deg,rgba(184,136,42,0.5),transparent);}

/* Divisions */
.h-divisions{padding:clamp(4rem,8vw,6rem) 0;}
.div-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule);}
.div-card{padding:2.2rem 2rem;border-right:1px solid var(--rule);position:relative;}
.div-card:last-child{border-right:none;}
.div-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--clay);}
.div-tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--clay);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.div-card h3{font-size:1.15rem;color:var(--forest);margin-bottom:0.9rem;}
.div-card ul{list-style:none;}
.div-card li{font-size:0.85rem;color:var(--ink-light);line-height:1.6;padding:0.4rem 0;border-top:1px solid var(--rule);}
.div-card li:first-child{border-top:none;}

/* Platforms */
.h-svc{padding:clamp(4rem,8vw,6rem) 0;border-top:1px solid var(--rule);}
.svc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--rule);}
.svc-card{padding:2rem 1.8rem;border-right:1px solid var(--rule);transition:background .2s;position:relative;}
.svc-card:last-child{border-right:none;}
.svc-card:hover{background:var(--cream-dark);}
.svc-icon{width:36px;height:36px;border-radius:50%;background:var(--cream-dark);display:flex;align-items:center;justify-content:center;margin-bottom:1.2rem;font-size:1rem;}
.svc-tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--clay);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.svc-card h3{font-size:1.02rem;margin-bottom:0.6rem;color:var(--forest);line-height:1.3;}
.svc-card p{font-size:0.85rem;color:var(--ink-light);line-height:1.65;}

.footer-cta{background:var(--forest);color:var(--cream);padding:clamp(3rem,6vw,4.5rem) 0;}
.footer-cta-inner{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;}
.footer-cta h2{font-size:clamp(1.3rem,2.3vw,1.8rem);color:var(--cream);}
.footer-cta p{color:var(--sage);margin-top:0.5rem;font-size:0.92rem;}

/* PLATFORM PAGE */
.pf-hero{padding:clamp(3.5rem,7vw,5.5rem) 0 1.5rem;}
.pf-kicker{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--moss);margin-bottom:1.1rem;}
.pf-hero h1{font-size:clamp(1.6rem,3vw,2.3rem);color:var(--forest);margin-bottom:0.9rem;}
.pf-hero p{font-size:1.02rem;color:var(--ink-light);line-height:1.65;max-width:68ch;}

.intake-wrap{padding:clamp(2.5rem,5vw,3.5rem) 0;}
.intake-box{background:var(--cream-dark);border:1px solid var(--rule);border-radius:3px;padding:clamp(1.8rem,4vw,2.8rem);}
.intake-title{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--forest);margin-bottom:1.6rem;padding-bottom:1rem;border-bottom:1px solid var(--rule);}
.intake-form{display:flex;flex-direction:column;gap:1.3rem;}
.intake-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--moss);margin-bottom:0.5rem;}
.intake-field input,.intake-field select{width:100%;padding:0.8rem 0.9rem;border:1px solid var(--rule);background:var(--cream);font-family:'Public Sans',sans-serif;font-size:0.93rem;color:var(--ink);border-radius:2px;outline:none;-webkit-appearance:none;}
.intake-field input:focus,.intake-field select:focus{border-color:var(--moss);}
.intake-submit{background:var(--forest);color:var(--cream);padding:0.95rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.04em;margin-top:0.3rem;transition:opacity .18s;}
.intake-submit:hover{opacity:.85;}
.intake-note{font-size:0.75rem;color:var(--ink-light);margin-top:-0.4rem;}
.intake-success{display:none;background:var(--forest);color:var(--cream);padding:1rem;border-radius:2px;font-size:0.88rem;margin-top:0.5rem;}

.sector-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--rule);margin-top:2rem;}
.sector-card{padding:2.2rem;border-right:1px solid var(--rule);}
.sector-card:last-child{border-right:none;}
.sector-card h3{font-size:1.1rem;color:var(--forest);margin-bottom:1.1rem;}
.sector-item{padding:0.8rem 0;border-top:1px solid var(--rule);}
.sector-item:first-child{border-top:none;}
.sector-item h4{font-size:0.9rem;color:var(--clay);margin-bottom:0.3rem;font-family:'Public Sans',sans-serif;font-weight:600;}
.sector-item p{font-size:0.85rem;color:var(--ink-light);line-height:1.6;}

/* CAPITAL & CLOUD PAGE */
.cc-hero{padding:clamp(3.5rem,7vw,5.5rem) 0 2rem;}
.cc-hero h1{font-size:clamp(1.6rem,3vw,2.3rem);color:var(--forest);margin-bottom:0.9rem;}
.cc-hero p{font-size:1.02rem;color:var(--ink-light);line-height:1.65;max-width:70ch;}

.pillar{padding:clamp(3rem,6vw,4.5rem) 0;border-top:1px solid var(--rule);}
.pillar-label{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--moss);margin-bottom:1rem;}
.pillar h2{font-size:clamp(1.3rem,2.2vw,1.7rem);color:var(--forest);margin-bottom:1.3rem;}

.flow-strip{display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;margin:1.8rem 0;padding:1.5rem;background:var(--cream-dark);border:1px solid var(--rule);border-radius:3px;}
.flow-step{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--forest);background:var(--cream);border:1px solid var(--rule);padding:0.6rem 1rem;border-radius:2px;white-space:nowrap;}
.flow-arrow{color:var(--clay);font-size:1.1rem;}

.pillar-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule);margin-top:1.5rem;}
.pillar-item{padding:1.8rem;border-right:1px solid var(--rule);}
.pillar-item:last-child{border-right:none;}
.pillar-item h4{font-size:1rem;color:var(--forest);margin-bottom:0.6rem;}
.pillar-item p{font-size:0.85rem;color:var(--ink-light);line-height:1.6;}

.cc-note{font-size:0.82rem;color:var(--ink-light);font-style:italic;margin-top:1.2rem;border-left:2px solid var(--gold);padding-left:1rem;}

.bottom-cta{background:var(--forest);color:var(--cream);padding:clamp(3rem,6vw,4.5rem) 0;margin-top:1rem;}
.bottom-cta-inner{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}

/* CONTACT PAGE */
.cp{padding:clamp(3.5rem,7vw,5.5rem) 0;}
.cp-inner{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,4vw,4rem);align-items:start;}
.cp-left h1{font-size:clamp(1.7rem,2.8vw,2.3rem);color:var(--forest);margin-bottom:1.1rem;}
.cp-left > p{font-size:0.95rem;color:var(--ink-light);line-height:1.7;margin-bottom:2.5rem;}
.cp-details{display:flex;flex-direction:column;}
.cp-detail{padding:1rem 0;border-top:1px solid var(--rule);}
.cp-detail:last-child{border-bottom:1px solid var(--rule);}
.cp-detail-label{font-family:'IBM Plex Mono',monospace;font-size:0.63rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--moss);margin-bottom:0.3rem;}
.cp-detail-val{font-size:0.93rem;color:var(--ink);}
.cp-form-wrap{background:var(--cream-dark);border:1px solid var(--rule);padding:2.2rem;border-radius:2px;}
form{display:flex;flex-direction:column;gap:1.2rem;}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.63rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--moss);margin-bottom:0.4rem;}
.field input,.field select,.field textarea{width:100%;padding:0.8rem 0.9rem;border:1px solid var(--rule);background:var(--cream);font-family:'Public Sans',sans-serif;font-size:0.93rem;color:var(--ink);border-radius:2px;outline:none;-webkit-appearance:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--moss);}
.field textarea{min-height:100px;resize:vertical;}
.form-btn{background:var(--forest);color:var(--cream);padding:0.9rem;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.04em;transition:opacity .18s;margin-top:0.2rem;}
.form-btn:hover{opacity:.85;}
.form-note{font-size:0.73rem;color:var(--ink-light);margin-top:-0.4rem;}

footer{background:var(--forest-deep);color:var(--sage);padding:3rem 0 1.8rem;}
.footer-top{display:grid;grid-template-columns:1fr auto;gap:2.5rem;padding-bottom:2.2rem;border-bottom:1px solid rgba(255,255,255,0.07);align-items:start;}
.footer-brand-name{font-family:'Lora',serif;font-size:1rem;color:var(--cream);margin-bottom:0.3rem;}
.footer-tagline{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--moss);}
.footer-cols{display:flex;gap:3rem;flex-wrap:wrap;}
.fc-title{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:0.9rem;}
.fc a{display:block;font-size:0.84rem;color:var(--sage);padding:0.2rem 0;transition:color .18s;}
.fc a:hover{color:var(--cream);}
.footer-bottom{display:flex;justify-content:space-between;padding-top:1.6rem;font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:rgba(143,175,138,0.4);flex-wrap:wrap;gap:0.5rem;}

@media(max-width:960px){
  .h-stats{grid-template-columns:repeat(2,1fr);}
  .h-stat:nth-child(2){border-right:none;}
  .div-grid{grid-template-columns:1fr;}
  .div-card{border-right:none;border-bottom:1px solid var(--rule);}
  .div-card:last-child{border-bottom:none;}
  .svc-cards{grid-template-columns:repeat(2,1fr);}
  .sector-grid{grid-template-columns:1fr;}
  .sector-card{border-right:none;border-bottom:1px solid var(--rule);}
  .pillar-list{grid-template-columns:1fr;}
  .pillar-item{border-right:none;border-bottom:1px solid var(--rule);}
  .pillar-item:last-child{border-bottom:none;}
  .cp-inner{grid-template-columns:1fr;}
  .footer-top{grid-template-columns:1fr;}
  .nav-links{display:none;}
  .section-header{flex-wrap:wrap;gap:0.5rem;}
  .section-header h2{white-space:normal;}
}
@media(max-width:600px){
  .svc-cards{grid-template-columns:1fr;}
  .h-hero-btns{flex-direction:column;}
  .h-stats{grid-template-columns:repeat(2,1fr);}
  .nav-ctas .nav-cta-secondary{display:none;}
}
</style>
</head>
